name: Deploy Front-end Local

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: [self-hosted, prod-front]
    
    environment: production

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Compilar Imagem de Produção e Iniciar Container
      env:
        DOCKER_TARGET_FRONT: prod
        FRONT_PORT: 80
        FRONT_CONTAINER_PORT: 80
        LOCAL_CODE_PATH: /usr/share/nginx/html
        LOCAL_CONTAINER_PATH: /usr/share/nginx/html
        LOCAL_NODE_MODULES: /usr/share/nginx/html
        VITE_URL_PRODUTOS: ${{ vars.VITE_URL_PRODUTOS }}
      run: |
        docker compose down || true
        docker rm -f frontend-container || true
        
        rm -f .env .env.production .env.local || true

        VITE_URL_PRODUTOS=$VITE_URL_PRODUTOS docker compose build --no-cache frontend
        docker compose up -d frontend