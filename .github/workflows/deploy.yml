name: Deploy Front-end

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: [self-hosted, prod-front]
    
    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Login no Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build e Push da Imagem de Produção
      uses: docker/build-push-action@v5
      with:
        context: .
        target: prod
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/meu-projeto-frontend:latest

    - name: Executar Container de Front-end no Servidor
      run: |
        docker pull ${{ secrets.DOCKERHUB_USERNAME }}/meu-projeto-frontend:latest
        docker stop frontend-container || true
        docker rm frontend-container || true
        # Roda o front-end diretamente na porta 80 padrão da sua máquina física
        docker run -d --name frontend-container -p 80:80 ${{ secrets.DOCKERHUB_USERNAME }}/meu-projeto-frontend:latest
