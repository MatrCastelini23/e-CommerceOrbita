    - name: Compilar Imagem de Produção e Iniciar Container
      run: |
        export DOCKER_TARGET_FRONT=prod
        export FRONT_PORT=80               # Porta de fora (acesso no navegador)
        export FRONT_CONTAINER_PORT=80     # Porta de dentro (onde o Nginx escuta) [1]
        
        # Sobrescrita dos volumes que fizemos antes
        export LOCAL_CODE_PATH=/usr/share/nginx/html
        export LOCAL_CONTAINER_PATH=/usr/share/nginx/html
        export LOCAL_NODE_MODULES=/usr/share/nginx/html
        
        docker compose down || true
        docker rm -f frontend-container || true
        
        docker compose build --no-cache frontend
        docker compose up -d frontend
