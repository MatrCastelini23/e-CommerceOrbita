name: Deploy Front-end Local

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: [self-hosted, prod-front]
    
    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Compilar Imagem de Produção e Iniciar Container
      run: |
        export DOCKER_TARGET_FRONT=prod
        export FRONT_PORT=80
        
        # 1. Derruba o container antigo e limpa a rede se ele existir
        docker compose down || true
        
        # 2. Remove o container antigo pelo nome explicitamente para garantir que a porta/nome fiquem livres
        docker rm -f frontend-container || true
        
        # 3. Reconstrói a imagem localmente sem cache
        docker compose build --no-cache frontend
        
        # 4. Sobe o novo container atualizado
        docker compose up -d frontend